# Configuration for Malicious URL Detector

model:
  max_features: 5000
  ngram_range: [1, 3]
  min_df: 5
  max_df: 0.8
  test_size: 0.2
  random_state: 42
  solver: 'lbfgs'
  max_iter: 1000
  C: 1.0

api:
  host: "0.0.0.0"
  port: 5000
  debug: true
  cors_enabled: true
  batch_limit: 50

features:
  tokenizer: "custom"
  use_tfidf: true
  use_additional_features: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/app.log"

paths:
  data: "data/malicious_phish.csv"
  model: "model.pkl"
  vectorizer: "vectorizer.pkl"
  encoder: "label_encoder.pkl"
  
threats:
  classes: ["benign", "defacement", "phishing", "malware"]
  colors:
    benign: "#28a745"
    defacement: "#ffc107"
    phishing: "#fd7e14"
    malware: "#dc3545"
  severities:
    benign: "low"
    defacement: "medium"
    phishing: "high"
    malware: "critical"